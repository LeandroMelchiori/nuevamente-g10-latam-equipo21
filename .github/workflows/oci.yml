name: CI y publicación OCI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            directory: backend
          - component: frontend
            directory: frontend
          - component: acceso
            directory: deploy/oci/demo_auth
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      ENVIRONMENT: test
      USE_MOCK_LLM: "true"
      RUN_OCI_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt
      - run: python -m pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1
      - run: python -m pytest -q

  publish:
    name: Imagen ARM64 (${{ matrix.image }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'LeandroMelchiori/nuevamente-g10-latam-equipo21'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
          - image: auth
            context: deploy/oci/demo_auth
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Construir y publicar en GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_COMPONENT: ${{ matrix.image }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-$IMAGE_COMPONENT:$GITHUB_SHA"
          docker build --pull --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "$BUILD_CONTEXT"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
